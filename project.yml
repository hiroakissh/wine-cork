name: Cork
options:
  bundleIdPrefix: com.hiroaki
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
targets:
  Cork:
    type: application
    platform: iOS
    sources:
      - path: Cork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiroaki.cork
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cork
        INFOPLIST_KEY_NSCameraUsageDescription: ワインボトルを撮影して登録するためにカメラを使用します。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: ワインボトル写真を選択して登録するために写真ライブラリを使用します。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - CorkTests
        - CorkUITests
  CorkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CorkTests
    dependencies:
      - target: Cork
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hiroaki.cork.tests
  CorkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CorkUITests
    dependencies:
      - target: Cork
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hiroaki.cork.uitests
